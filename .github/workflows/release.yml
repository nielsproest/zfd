# Publishes a GitHub release with the Arch package attached, once the Test
# workflow has passed on a push to master. It builds exactly the commit that was
# tested. A commit with [skip ci] in its message is neither tested nor released.
# "Run workflow" on the Actions tab releases the current master by hand.
#
# Versions: each build is pkgver <PKGBUILD pkgver>.r<run number>.g<commit>, e.g.
# 0.0.1.r7.g1a2b3c4, so every release sorts newer than the one before it (and
# newer than local 0.0.1-<pkgrel> builds) and `pacman -U` sees it as an upgrade.
name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag

concurrency:
  group: release
  cancel-in-progress: false # releases go out in push order

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git github-cli zig pkgconf \
            glfw libglvnd libx11 libxext libxrandr systemd-libs

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Version
        id: ver
        run: |
          base=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          ver="${base}.r${GITHUB_RUN_NUMBER}.g${SHA::7}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}.r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD

      # makepkg refuses to run as root. -d: the runtime-only depends
      # (xdg-desktop-portal) aren't needed to build.
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && makepkg -f -d'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "ZFD ${{ steps.ver.outputs.ver }}" \
            --generate-notes \
            packaging/arch/zfd-*.pkg.tar.zst
