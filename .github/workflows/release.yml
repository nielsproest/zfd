# Publishes a GitHub release with the Arch package attached, once the Test
# workflow has passed on a push to master. It builds exactly the commit that was
# tested. A commit with [skip ci] in its message is neither tested nor released.
# "Run workflow" on the Actions tab releases the current master by hand.
#
# Versions follow packaging/arch/PKGBUILD as it is: pkgver=0.0.1 and pkgrel=155
# release as v0.0.1-155 with zfd-0.0.1-155-x86_64.pkg.tar.zst. A release goes out
# when pkgver or pkgrel changes; while that version is already released, a push
# is tested and nothing more.
name: Release
# A run started by Test's result isn't attached to the commit's checks, so name it
# after the commit it releases.
run-name: "Release: ${{ github.event.workflow_run.display_title || 'current master' }}"

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag

concurrency:
  group: release
  cancel-in-progress: false # releases go out in push order

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git github-cli zig pkgconf \
            glfw libglvnd libx11 libxext libxrandr systemd-libs

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' packaging/arch/PKGBUILD)
          ver="${pkgver}-${pkgrel}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$ver is already released; bump pkgrel (or pkgver) in packaging/arch/PKGBUILD for a new one."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # makepkg refuses to run as root. -d: the runtime-only depends
      # (xdg-desktop-portal) aren't needed to build.
      - name: Build package
        if: steps.ver.outputs.new == 'true'
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c 'cd packaging/arch && makepkg -f -d'

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "ZFD ${{ steps.ver.outputs.ver }}" \
            --generate-notes \
            packaging/arch/zfd-*.pkg.tar.zst
